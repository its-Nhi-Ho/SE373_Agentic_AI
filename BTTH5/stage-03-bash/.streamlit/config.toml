# Cấu hình Streamlit của project (đọc khi chạy `uv run streamlit run app.py` trong thư mục này).

[server]
# Không hỏi email ở lần chạy đầu và không tự mở trình duyệt: mở Local URL in ra terminal.
headless = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0F766E"
baseRadius = "medium"
font = "sans-serif"
codeFontSize = "0.8rem"

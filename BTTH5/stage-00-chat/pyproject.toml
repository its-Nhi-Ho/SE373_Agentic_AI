[project]
name = "stage-00-chat"
version = "0.1.0"
description = "Lab Agent Tools & Skills, stage 00: chat không có tool"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3,<2",
    "langchain-openai>=1.6.7,<2",
    "python-dotenv>=1.2.4,<2",
    "streamlit>=1.65.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
